version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Hold a new release back for a week (a major for two) before proposing it.
    # A compromised publish is usually caught and yanked within days, and this is
    # the cheapest way not to be the first to install it. Security updates are
    # not subject to cooldown, so a fix still arrives as soon as it exists.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # Every security fix in one PR, separate from routine bumps. This is the
      # fast lane in docs/DEPENDENCIES.md: triage within a day.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      # The test runner and everything peered to it, as one PR.
      #
      # This group exists because of a specific failure on 8 September.
      # `@vitest/coverage-v8` declares `vitest` as an *exact* peer, so the two
      # only move together. Dependabot opened the 4.1.11 -> 5.0.0 bump as two
      # separate PRs (#162, #163) and neither could pass: each branch died at
      # `npm ci` with ERESOLVE, taking eight checks down with it, before a
      # single test ran. Both had to be closed and redone by hand as one
      # lockfile (#165). Nothing about that was a real incompatibility; it was
      # only the split.
      #
      # This group is listed first because a dependency joins the first group it
      # matches, and it deliberately sets no `update-types`, so it takes majors
      # too. `dev-dependencies` below covers only minor and patch, which is
      # exactly why a major arrived ungrouped last time.
      #
      # `@stryker-mutator/*` is in here for the same reason one step out. It
      # declares only `vitest >=2.0.0` -- a range too loose to fail a resolve
      # and too loose to be reassuring -- so a vitest major can need a matching
      # runner without npm ever saying so. The nightly mutation run is where
      # that would surface, hours later and read as a score regression. Better
      # to have both versions in one diff.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
          - '@stryker-mutator/*'
      # Everything that ends up inside a shipped artifact (the union of
      # `.bundled/*.json`), runtime or not. Never merged on a green CI alone: these
      # are tiers A and B in docs/DEPENDENCIES.md, and a bump without a reason to
      # take it is closed. Listed before `dev-dependencies` so the three bundled
      # devDependencies land here and not in the routine batch.
      shipped:
        patterns:
          - fflate
          - hash-wasm
          - jsqr
          - pdf-lib
          - qrcode
          - webextension-polyfill
          - fast-png
          - jpeg-js
          - '@pdf-lib/*'
      # The tools that produce what ships: the bundler (vite, which brings
      # rolldown with it), the emitted and rolled-up library types, and the
      # packaging scripts. Tier C in docs/DEPENDENCIES.md, so the same rule as
      # `shipped`: no bump without a reason, and a diff of the built output when
      # there is one. Without this group they arrived in the routine dev batch:
      # vite 8.3.5 rode in with an eslint plugin in #241.
      build-chain:
        patterns:
          - vite
          - typescript
          - tsx
          - '@microsoft/api-extractor'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Hold vitest at 4.x until `@stryker-mutator/vitest-runner` supports 5.
      #
      # The group above was built to keep these versions in one diff, and it did.
      # What it could not do is supply a runner that did not exist: 10.0.0 is the
      # newest release and still declares `vitest >=2.0.0`, so vitest 5.0.0
      # resolved cleanly, installed without a warning, and went in alone (#165).
      #
      # Under vitest 5 the runner names each mutant's covering tests and then
      # runs none of them -- `Ran 0.00 tests per mutant` -- so every mutant it
      # measures is recorded as survived. Measured on one 15-mutant slice of
      # crypto.ts, same source both times: 100.00% on 4.1.11, 0.00% on 5.0.0.
      #
      # It took two days to surface and did not look like a tooling fault when it
      # did. The nightly is incremental, so the night after the bump reused every
      # stored verdict and stayed green; the first code change to a mutated file
      # invalidated those mutants, re-ran them through the broken runner, and the
      # score collapsed -- reading exactly like a test regression in the change
      # that happened to land. That is the failure mode the comment above
      # predicted, and grouping was the wrong instrument for it.
      #
      # REMOVE THIS once a runner release declares support for vitest 5: drop the
      # entry, let the group bring both across together, and confirm the next
      # forced Sunday run reports a non-zero tests-per-mutant before trusting the
      # score.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
      # Every other action, as one weekly PR. With main requiring branches to
      # be up to date, each separate PR merged meant a rebase and another
      # half-hour CI run for every one still open.
      actions:
        patterns:
          - '*'
