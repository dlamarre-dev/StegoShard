name: Fuzz

# Deep parser fuzzing off the PR critical path: nightly, plus on demand. The
# seed comes from the run id so coverage accumulates over time; a regression
# (a non-Error throw, hang, or crash in a parser) fails the run.
on:
  schedule:
    - cron: '27 4 * * *' # nightly, 04:27 UTC
  workflow_dispatch:
    inputs:
      iters:
        description: 'Iterations per target'
        default: '200000'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Parser fuzzing
    # scripts/fuzz.ts says a hang is "caught by the CI timeout". Until now the only
    # timeout was GitHub's implicit 360-minute job cap, so a hang would have burned
    # six hours before saying anything. The nightly run is 200k iterations per
    # target; 45 minutes is generous against that and still fails fast.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fuzz parsers
        # The dispatch input reaches the shell through the environment, not
        # through `${{ }}` inside `run:`. An expression pasted into a run block
        # is substituted before the shell parses the line, so a crafted input
        # would execute as shell; "$ITERS" is inert, and the guard below keeps
        # it to a plain integer besides.
        env:
          ITERS: ${{ inputs.iters }}
          SEED: ${{ github.run_id }}
        run: |
          case "$ITERS" in
            '') ITERS=200000 ;;
            *[!0-9]*) echo "iters must be a positive integer, got: $ITERS" >&2; exit 1 ;;
          esac
          npm run fuzz -- --iters="$ITERS" --seed="$SEED"
