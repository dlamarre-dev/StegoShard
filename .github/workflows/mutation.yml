# Mutation testing, nightly, sharded and incremental.
#
# Coverage says a line ran. It does not say anything would have noticed had the
# line been wrong. This repository has found that difference by hand five times,
# most recently an `if (found) break;` in openSlotArray that 669 tests could not
# see. Stryker is that method, automated.
#
# WHY THIS IS SHARDED
# The first full nightly took 40 minutes over 1,605 mutants. Widening the test
# selection so the score stopped under-reporting made every vault and stego mutant
# re-run the CLI integration tests, and the next run was cancelled at the
# 180-minute timeout having done 86% of the work: about 3h20 end to end, at 7.0
# seconds per mutant against 2.4 for access.ts alone. Per-mutant cost varies by an
# order of magnitude between files, which is why extrapolating from one file was
# wrong.
#
# Four shards in parallel bound the cold cost to the largest one rather than to
# their sum. Three forced runs have now been measured, the first sharded run on
# 16 August and the two Sunday rebuilds since:
#
#            16 Aug   23 Aug   30 Aug    6 Sep   mutants
#   crypto   69 min   60 min   74 min   50 min       463
#   codes    49 min   50 min   30 min   71 min       417
#   stego    42 min   32 min   34 min   49 min       323
#   vault    30 min   33 min   32 min   43 min       405
#   ------   ------   ------   ------   ------
#   wall     69 min   61 min   74 min   71 min
#
# Against 3h20 in sequence, so the shape of the decision holds. Two things in that
# table are worth reading, though, because neither was visible from one run.
#
# **Run to run variance is wide.** crypto swings 60 to 74 minutes for the same 463
# mutants: about 20%, on hosted runners of unknown neighbours. Any budget set here
# is a budget against the spread, not against a number.
#
# **Survivors drive the cost, not mutants.** codes fell from 50 minutes to 30
# between the two Sundays with its mutant count unchanged at 417, because 15
# mutants moved from survived to killed (score 87.53 to 91.13). A killed mutant
# stops at the first failing test; a survivor runs every test that covers it. So
# better tests make the run *faster*, and a shard that slows down without its
# mutant count moving is a shard whose score has slipped. That refines what the
# first run already suggested: what drives the cost is which tests cover a mutant,
# not how many mutants there are.
#
# **The binding shard changed on 6 September**, and the two halves of that move
# are the clearest illustration of the paragraph above. codes went from 30 to 71
# minutes because the selection fix gave it back `modes.test.ts`, which drives
# access.ts end to end. crypto went from 74 to 50 because its survivors fell from
# 73 to 31, and a killed mutant stops at the first failing test while a survivor
# runs every test that covers it. More tests, less time.
#
# The wall clock barely moved, 74 to 71 minutes, which is the thing to watch: the
# total says nothing about whether a shard is close to the timeout, because which
# shard is largest is not stable. Read the column, not the last row.
#
# Still no rebalancing. codes is now the constraint, and its cost is concentrated
# in access.ts, a single file Stryker cannot split. The same argument that applied
# to crypto applies to it, and moving the other files between shards changes
# nothing while one file is the tallest column.
#
# WHY THIS IS INCREMENTAL, AND WHAT THAT COSTS
# Mutation testing is deterministic given the same code and the same tests, so
# re-running unchanged mutants every night buys no information at all. Stryker's
# incremental mode stores results and re-tests only what changed.
#
# Measured in CI, 16 August, cold then warm with nothing changed:
#
#   crypto  69 min -> 3 min
#   codes   49 min -> 2 min
#   stego   42 min -> 3 min
#   vault   30 min -> 3 min
#
# 69 minutes of wall clock down to 3. What remains is the dry run, which
# establishes which tests cover which mutant and cannot be skipped, so a quiet
# night costs that and not zero.
#
# That has held. A quiet night on 3 September ran 3 min 20 to 3 min 42 across all
# four shards, two weeks and several hundred tests later, which is what you would
# expect of a cost that is the dry run rather than the mutants.
#
# That introduces a trust assumption, and it is the dangerous kind: incremental
# mode decides a mutant need not be re-run. If that decision is ever wrong, a
# mutant recorded as killed stays killed forever while it actually survives, and
# nothing reports it. A silent pass, introduced by an optimisation.
#
# So Sunday runs with --force, ignoring the stored results and measuring
# everything. **The Sunday number is the measurement; the other nights are a fast
# regression detector.** Read them differently.
#
# THAT ASSUMPTION BROKE ON 8 SEPTEMBER, in the other direction, and it is worth
# reading before trusting a green night here.
#
# vitest 5.0.0 landed (#165) against `@stryker-mutator/vitest-runner@10`, which
# supports it only in the sense that `vitest >=2.0.0` does not exclude it. Under
# vitest 5 the runner names each mutant's covering tests and then runs none of
# them -- `Ran 0.00 tests per mutant` -- so every mutant it measures is written
# down as survived.
#
# The night after the bump was GREEN. Nothing had changed in any mutated file, so
# every verdict was reused and the broken runner was never asked a question. The
# next change to touch crypto.ts and vault.ts invalidated their mutants, re-ran
# them through the broken runner, and dropped crypto from 92.66% to 28.39% --
# which read as a test regression in that change rather than as a measurement
# that had been dead for two days. stego, whose file nobody touched, sat
# unchanged at 85.76% throughout and was just as meaningless.
#
# So: a green incremental night means "nothing was re-measured", not "everything
# still holds", and a score that moves only on the shards someone edited is a
# signature worth suspecting the harness for. `Ran N tests per mutant` near zero
# in the log is the direct tell.
#
# THE SCORE GATES THIS WORKFLOW, and nothing else. `break` is 75 in
# stryker.config.mjs -- see "THE THRESHOLD" there for the calibration. It is a
# regression alarm on a scheduled run, not a pull-request gate: no PR is blocked
# by it, and a drop turns a nightly red rather than scrolling past in a summary
# table nobody opens. It is what eventually caught the failure above.
name: Mutation testing

on:
  schedule:
    # Monday through Saturday: incremental, fast, detects regressions.
    - cron: '0 3 * * 1-6'
    # Sunday: a full rebuild, which is the only run whose score means anything.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore stored results and re-test every mutant'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  stryker:
    name: Mutation score (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Raised from 90 to 120 once three forced runs existed instead of one.
    #
    # 90 was set against a single cold measurement of 69 minutes. The Sunday
    # rebuilds since have run crypto at 60 and at 74, so the worst case the old
    # number was sized against has already been passed, and 20% run-to-run spread
    # on the same 463 mutants puts another bad Sunday within reach of 90 on
    # variance alone.
    #
    # A cold run is not the exception here: Sunday forces one every week, by
    # design, and it is the only run whose score means anything, so a timeout kill
    # costs the week's one real measurement and leaves the incremental nights
    # building on stale stored results.
    #
    # The reasoning above also predicted the next forced run would put crypto past
    # 74 minutes, because the programmatic API had added several hundred tests to
    # the selection. That was wrong, and wrong in a way worth keeping. On
    # 6 September crypto came in at 50, having got *faster* as its survivors fell,
    # while codes went from 30 to 71 and became the tallest column. The headroom
    # was needed; it was simply needed somewhere else.
    #
    # So the number to size against is not any one shard's history. It is whichever
    # shard is currently largest, and which shard that is changes when the tests
    # change. 120 still catches a hang by a wide margin: an incremental night is 3
    # to 4 minutes, and the slowest forced shard ever recorded is 74.
    timeout-minutes: 120
    strategy:
      # One slow shard must not cancel the others: a partial table is still worth
      # reading, and the aggregate job below is built to say which shard is absent.
      fail-fast: false
      matrix:
        include:
          - shard: crypto
            files: src/core/crypto.ts
          - shard: vault
            files: src/core/vault.ts
          - shard: stego
            files: src/core/stego.ts
          - shard: codes
            files: src/core/reed-solomon.ts,src/core/access.ts,src/core/gf256.ts,src/core/erasure.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Decide incremental or forced
        id: mode
        run: |
          set -euo pipefail
          # The Sunday cron and an explicit dispatch both force a full rebuild.
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "force=--force" >> "$GITHUB_OUTPUT"
            echo "label=full rebuild" >> "$GITHUB_OUTPUT"
          else
            echo "force=" >> "$GITHUB_OUTPUT"
            echo "label=incremental" >> "$GITHUB_OUTPUT"
          fi

      # One file per shard: they mutate different sets, so a shared file would
      # invalidate the others' results.
      #
      # Rolling key with restore-keys, because a cache entry is immutable: the run
      # restores the most recent entry for its shard and writes a new one under a
      # key carrying this run's id.
      #
      # THE KEY CARRIES A GENERATION, and `v2` is not decoration. A stored result
      # is only as trustworthy as the runner that produced it, and on 10 and 11
      # September the runner produced false ones: vitest 5.0.0 against
      # `@stryker-mutator/vitest-runner@10` ran no tests at all per mutant, so
      # every mutant it measured was written down as survived. Pinning vitest back
      # to 4.x fixes the runner but touches no mutated source, so the differ would
      # have happily reused those verdicts and reported the same collapsed score
      # against a working runner. Retiring the old prefix is what forces the
      # rebuild. Bump the generation whenever a change makes stored results
      # untrustworthy rather than merely stale.
      - name: Restore the incremental results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental-${{ matrix.shard }}.json
          key: stryker-v2-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: stryker-v2-${{ matrix.shard }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker (${{ steps.mode.outputs.label }})
        run: |
          # The report name stays whatever stryker.config.mjs sets. Stryker has no
          # CLI flag for a nested reporter option, and it does not need one here:
          # each shard uploads under its own artifact name, so the aggregate job
          # gets one directory per shard with an identically named file inside.
          npm run mutation -- \
            --mutate '${{ matrix.files }}' \
            --incremental \
            --incrementalFile 'reports/mutation/incremental-${{ matrix.shard }}.json' \
            ${{ steps.mode.outputs.force }}

      # Saved even when the run failed: a partial incremental file is still ahead
      # of no file, and the next run re-tests whatever is missing from it.
      - name: Save the incremental results
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/incremental-${{ matrix.shard }}.json
          key: stryker-v2-${{ matrix.shard }}-${{ github.run_id }}

      # Distinct names per shard. upload-artifact v4 and later refuse a second
      # upload under a name that already exists, so a shared name would fail the
      # moment two shards finished.
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation
          if-no-files-found: warn

  summarise:
    name: Mutation score (all shards)
    needs: stryker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needed for scripts/mutation-summary.mjs. The summary used to be an inline
      # `node -e` string, which required no checkout; moving it to a file to make
      # it testable made this job depend on the repository, and the dependency was
      # not added with it. It failed twice for two different reasons before this
      # job ran green once.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-report-*
          path: reports

      - name: Write one table for all four shards
        run: node scripts/mutation-summary.mjs reports
