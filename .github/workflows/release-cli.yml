name: Release CLI binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Require tag and package versions to match
        run: bash scripts/check-release-version.sh
      - run: npm run audit
      - run: npm run ci:node

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: stegoshard-linux-x64
            archive: stegoshard-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: stegoshard-macos-arm64
            archive: stegoshard-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: stegoshard-windows-x64.exe
            archive: stegoshard-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Build bundled CLI
        run: npm run build:cli
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Compile standalone network-disabled binary
        run: >
          deno compile --allow-read --allow-write --allow-env --no-prompt
          --target ${{ matrix.target }}
          --output ${{ matrix.name }}
          dist-cli/stegoshard.js
      # No UPX. It is incompatible with `deno compile` output, in two different
      # ways: on Linux it refuses outright ("CantPackException: bad e_phoff"),
      # and on Windows it packs successfully but produces a binary that aborts
      # on startup inside V8 ("Check failed: old_protection == PAGE_READWRITE"),
      # because V8 re-protects pages for JIT and UPX's unpacker leaves them in a
      # state it rejects. The Windows case is the dangerous one: the release
      # would have published, checksummed, and attested an executable that
      # crashes on first run. Compress the download, never the executable.
      # `deno compile` output is 215-254 MB raw, too large to serve bare, and
      # the archive is unpacked before anything runs it.
      #
      # Shared with the release dry run, which extracts the archive and runs the
      # binary from inside it. See scripts/package-cli-binary.sh.
      - name: Package for download
        env:
          BIN: ${{ matrix.name }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: bash scripts/package-cli-binary.sh "$BIN" "$ARCHIVE"
      # Handed to `publish` below, which attaches the archives to the GitHub
      # release. That release copy is the durable one, so this is a ~85 MB
      # relay and the default 90 days is just three of them per tag sitting in
      # artifact storage after the thing a user downloads is already published.
      #
      # A week rather than a day, deliberately: it is the window in which
      # `publish` can be re-run against an existing build if it fails at the
      # attestation or upload step. Past that, re-tag and rebuild.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stegoshard-*
          path: release
          merge-multiple: true
      # Checksums and attestation cover the archives; that is what a user
      # actually downloads, so that is what they can verify. Shared with the
      # dry run; see scripts/assemble-cli-release.sh.
      - name: Add licenses, SBOM, and checksums
        run: bash scripts/assemble-cli-release.sh release
      # SHA256SUMS.txt is attested alongside the archives, and that inclusion is
      # the point rather than a detail.
      #
      # It used to be excluded, because `subject-path` matched only
      # `stegoshard-*`. docs/CLI.md said so plainly -- the checksum file "vouches
      # for the archives and nothing vouches for it" -- which left the file that
      # exists to establish integrity as the one file on the release page with
      # none of its own. Anyone who could replace an archive could replace the
      # list beside it, and the checksum check would agree with the forgery.
      #
      # Attesting it does not make `sha256sum -c` a provenance check; that
      # distinction is real and docs/CLI.md keeps it. What it does is let a user
      # who verifies the checksum file first then trust the cheap check for the
      # rest, instead of needing `gh attestation verify` on every archive.
      #
      # LICENSE and THIRD_PARTY_NOTICES.txt stay out: they carry no integrity
      # claim about anything, so attesting them would only blur what the
      # attestation means.
      - name: Attest released archives and their checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/stegoshard-*
            release/SHA256SUMS.txt
      - name: Publish checksummed release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
