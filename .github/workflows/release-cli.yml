name: Release CLI binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Require tag and package versions to match
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run audit
      - run: npm run ci:node

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: stegoshard-linux-x64
            upx: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: stegoshard-macos-arm64
            upx: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: stegoshard-windows-x64.exe
            upx: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Build bundled CLI
        run: npm run build:cli
      - uses: denoland/setup-deno@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v2
        with:
          deno-version: v2.9.5
      - name: Compile standalone network-disabled binary
        run: >
          deno compile --allow-read --allow-write --allow-env --no-prompt
          --target ${{ matrix.target }}
          --output ${{ matrix.name }}
          dist-cli/stegoshard.js
      - name: Compress with UPX
        if: matrix.upx
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        with:
          install: true
          files: ${{ matrix.name }}
          args: --best --lzma
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: stegoshard-*
          path: release
          merge-multiple: true
      - name: Add licenses, SBOM, and checksums
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.txt release/
          npm sbom --omit=dev --sbom-format=cyclonedx > release/stegoshard-npm.cdx.json
          (cd release && sha256sum stegoshard-* LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt)
      - name: Attest released binaries
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: release/stegoshard-*
      - name: Publish checksummed release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: release/*
