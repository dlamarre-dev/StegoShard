name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm run audit

      - name: Notices, formatting, lint, typecheck, and tests
        run: npm run ci:node

      # Prettier cannot parse shell, so scripts/*.sh are invisible to
      # format:check. They carry real release logic (two of the defects found
      # during the release-path audit were shell bugs) so lint them properly.
      # shellcheck ships on the runner image.
      - name: Shell script lint (shellcheck)
        run: npm run lint:shell

      # Quick fixed-seed parser fuzz smoke; the deep nightly run is fuzz.yml.
      - name: Fuzz smoke (parsers)
        # The seed used to be fixed at 1, so this smoke test replayed the same
        # 2,000 cases on every pull request since it was written. Deriving it from
        # the commit SHA varies the cases across commits while staying exactly
        # reproducible: the seed is printed on the first line of the job log.
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run fuzz -- --iters=2000

      - name: Build and validate exact extension packages
        run: npm run package

      - name: Build (web app)
        run: npm run build:web

      - name: Build (CLI)
        run: npm run build:cli

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: CLI smoke test (Deno)
        run: |
          echo "deno smoke: save + restore a vault with the bundled CLI" > /tmp/ss-secret.txt
          STEGOSHARD_PASSWORD='Correct-Horse-Battery-Staple-42!' deno run --allow-read --allow-write --allow-env \
            dist-cli/stegoshard.js save /tmp/ss-secret.txt --out /tmp/ss-out
          STEGOSHARD_PASSWORD='Correct-Horse-Battery-Staple-42!' deno run --allow-read --allow-write --allow-env \
            dist-cli/stegoshard.js restore /tmp/ss-out --out /tmp/ss-restored
          diff /tmp/ss-secret.txt /tmp/ss-restored/ss-secret.txt
          echo "Deno round-trip OK"

      - name: Upload validated browser builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-browser-builds
          path: dist-release
          if-no-files-found: error

  browser-e2e:
    name: Browser, accessibility, CSP, and extension smoke
    timeout-minutes: 30
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-browser-builds
          path: dist-release
      - name: Build production web app
        run: npm run build:web
      # For the cli-ui specs: this produces both dist-cli/web-ui (what
      # `stegoshard ui` serves) and web-dist-offline/serve.mjs (the launcher the
      # download ships). Without it those specs have nothing to start, and they
      # fail rather than skip, so this step cannot be dropped unnoticed.
      - name: Build CLI and offline web app
        run: npm run build:cli
      # Same treatment, same reason: the browser download hung alongside the apt
      # one, so the cap belongs on both rather than on whichever was noticed.
      #
      # `--with-deps` shells out to apt, and killing this on a timeout leaves
      # that apt holding /var/lib/dpkg/lock-frontend, which made the first
      # version of this retry fail both remaining attempts instantly with
      # "Could not get lock". Every attempt after the first therefore reaps what
      # the previous one left behind.
      - name: Install pinned browsers
        timeout-minutes: 15
        run: |
          source .github/scripts/apt-lock.sh
          for attempt in 1 2 3; do
            if timeout --kill-after=30 420 npx playwright install --with-deps chromium firefox; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt did not finish; retrying"
            release_apt_locks
            sleep $((attempt * 15))
          done
          echo "::error::playwright install did not finish after three attempts"
          exit 1
      - name: Run browser E2E suite
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  crypto-scan:
    name: Post-quantum crypto scan (QRAMM)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.0'

      - name: Install QRAMM scanners
        run: |
          go install github.com/csnp/cryptoscan/cmd/cryptoscan@v1.3.0
          go install github.com/csnp/qramm-cryptodeps/cmd/cryptodeps@v1.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Source scan. Auto-detects .cryptoscan.yaml (failOn: high + documented false-positive
      # suppressions), so this fails only if a *new* HIGH/CRITICAL algorithm is introduced.
      - name: cryptoscan, gate on new weak/quantum-vulnerable crypto
        run: cryptoscan scan .

      # Cryptographic Bill of Materials, uploaded as a build artifact (not committed,
      # it tracks dependency capabilities and would drift).
      - name: cryptoscan, generate CBOM
        run: cryptoscan scan . --format cbom --output crypto-bom.json

      # Dependency view. Capability-based for npm/pypi (reachability is Go-only), so it
      # over-reports what libraries *can* do (hash-wasm→MD5/SHA-1, cryptography→RSA) vs
      # what StegoShard actually uses (Argon2id, AES-256-GCM). Informational only.
      - name: cryptodeps, dependency report (informational)
        run: cryptodeps analyze . --fail-on none

      - name: Upload CBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crypto-bom
          path: crypto-bom.json

  steganalysis:
    name: Steganalysis (zsteg, StegExpose)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Archived since 2018 and unlicensed, so it is fetched rather than vendored,
      # and never executed unless the bytes match. Same rule as the SHA-pinned
      # actions above: nothing runs on trust.
      STEGEXPOSE_SHA256: abef6be0216aae9a2c938342df632727af80bcaac867da6d7c46cb0a1d4a6ade
      MATH3_SHA256: a07e39d31c46032879f0a48ae1bd0142b17dd67664c008b50216e9891f346c54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-steganalysis.lock

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install detectors
        run: |
          gem install zsteg --no-document
          mkdir -p "$RUNNER_TEMP/stegexpose"
          cd "$RUNNER_TEMP/stegexpose"
          for f in StegExpose.jar commons-math3-3.1.1.jar; do
            curl -fsSL -o "$f" "https://github.com/b3dk7/StegExpose/raw/master/$f"
          done
          echo "$STEGEXPOSE_SHA256  StegExpose.jar" | sha256sum -c -
          echo "$MATH3_SHA256  commons-math3-3.1.1.jar" | sha256sum -c -
          echo "STEGEXPOSE_JAR=$RUNNER_TEMP/stegexpose/StegExpose.jar" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install --require-hashes -r python/requirements-steganalysis.lock

      - name: Audit steganalysis dependencies
        run: pip-audit -r python/requirements-steganalysis.lock --require-hashes

      # CI=true turns a missing detector into a hard failure instead of a skip, so
      # this suite can never quietly stop running.
      - name: Steganalysis suite
        run: npm run test:steganalysis -- -q

  erasure-field:
    name: Erasure cross-check (reedsolo, galois)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-erasure.lock

      # No native build and no downloaded jar: both libraries ship universal wheels, so
      # this job has nothing to compile. 243 seconds measured, against 133 when galois
      # covered 42 layouts and 41 before galois existed. The MDS sweep over all 192
      # layouts is the bulk of it. Every figure here is measured on a real run, never
      # estimated; if the sweep grows again, re-measure rather than adjust.
      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install --require-hashes -r python/requirements-erasure.lock

      - name: Audit erasure suite dependencies
        run: pip-audit -r python/requirements-erasure.lock --require-hashes

      # CI=true turns a missing tsx or a missing reedsolo into a hard failure
      # instead of a skip, so the field comparison can never quietly stop running.
      - name: GF(2^8) cross-check
        run: npm run test:erasure -- -q

  crypto-compliance:
    name: Primitive compliance (crypto-condor)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # TestU01 still uses K&R function definitions, which a C23-default compiler
      # rejects outright. Pinning the dialect keeps the build working regardless of
      # which gcc the runner image ships.
      CFLAGS: '-std=gnu89 -w'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-compliance.lock

      # crypto-condor compiles its internal AES and TestU01 on first use, into a
      # per-user cache directory. Without this the C build is repaid every run.
      - name: Cache crypto-condor build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crypto-condor
          key: crypto-condor-${{ runner.os }}-${{ hashFiles('python/requirements-compliance.lock') }}

      # Capped and retried: this step hung for over thirty minutes on three
      # separate runs while every other job passed, and with no ceiling it would
      # have run to the six-hour default. A mirror that stops answering is not a
      # reason to hold a pull request all afternoon.
      - name: Install build tools for TestU01
        timeout-minutes: 10
        run: |
          source .github/scripts/apt-lock.sh
          for attempt in 1 2 3; do
            if timeout --kill-after=30 180 sudo apt-get update && \
               timeout --kill-after=30 180 sudo apt-get install -y autoconf automake libtool; then
              exit 0
            fi
            echo "::warning::apt-get attempt $attempt did not finish; retrying"
            release_apt_locks
            sleep $((attempt * 15))
          done
          echo "::error::apt-get did not finish after three attempts"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install --require-hashes -r python/requirements-compliance.lock

      # This lockfile is dev-only and never shipped, but it still gets audited.
      # Two separate crypto-condor 2025.9.8 bounds hold cryptography at 43.0.3:
      #   - a direct `cryptography<44`, which alone blocks 44.0.1 (that release
      #     needs only `cffi>=1.12`, so cffi is not the obstacle there);
      #   - `cffi<2`, which additionally blocks 46.0.5 and newer, since those
      #     require `cffi>=2.0.0` on Python 3.9+.
      # Overriding the first alone resolves to cryptography 45.0.7 with cffi
      # untouched and clears exactly one advisory (PYSEC-2026-1284); the other six
      # need 46.0.6 or later and therefore the cffi bump too. Carrying six ignores
      # instead of seven does not justify running the tool that supplies our
      # assurance on dependencies its author has not tested, in an environment
      # whose entire input is published test vectors. crypto-condor itself does run
      # correctly under cryptography 50 (identical CAVP results), so the bounds look
      # conservative rather than load-bearing: revisit when upstream relaxes them.
      # `click` was pinned forward instead, since that one was ours to fix.
      - name: Audit compliance dependencies
        run: >-
          pip-audit -r python/requirements-compliance.lock --require-hashes
          --ignore-vuln PYSEC-2026-35
          --ignore-vuln PYSEC-2026-1284
          --ignore-vuln PYSEC-2026-2141
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf

      # CI=true turns a missing TestU01 into a hard failure instead of a skip, so
      # the randomness group can never quietly stop running.
      - name: Primitive compliance suite
        run: npm run test:compliance -- -q

  conformance:
    name: Python decoder conformance
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The golden-corpus check diffs against the base branch, and the
          # default shallow checkout leaves origin/main unreachable. Without this
          # the check would silently find nothing to compare and pass.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-dev.lock

      - name: Install dependencies
        run: npm ci

      - name: Generate fixtures (extension encodes)
        run: npm run fixtures -- python/tests/_fixtures

      - name: Install Python dependencies
        run: pip install --require-hashes -r python/requirements-dev.lock

      - name: Python lint and typecheck
        run: |
          ruff check python
          mypy python/stegoshard

      - name: Audit Python runtime dependencies
        run: pip-audit -r python/requirements.lock --require-hashes

      - name: Generate reproducible Python runtime SBOM
        run: >-
          cyclonedx-py requirements python/requirements.lock
          --output-reproducible
          --output-file python-runtime.cdx.json

      - name: Upload Python runtime SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-runtime-sbom
          path: python-runtime.cdx.json
          if-no-files-found: error

      # The golden corpus is committed and must not be regenerated to make a test
      # pass. Needs the full history from the checkout above; under CI the script
      # fails rather than skipping when it cannot diff, so a shallow checkout
      # cannot turn this into a silent pass.
      - name: Golden corpus was not regenerated without a version bump
        run: npm run golden:check -- --base=origin/${{ github.base_ref || 'main' }}

      - name: Conformance test (Python decodes)
        run: pytest python -q
