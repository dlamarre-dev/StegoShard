name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm run audit

      - name: Notices, formatting, lint, typecheck, and tests
        run: npm run ci:node

      # Prettier cannot parse shell, so scripts/*.sh are invisible to
      # format:check. They carry real release logic (two of the defects found
      # during the release-path audit were shell bugs) so lint them properly.
      # shellcheck ships on the runner image.
      - name: Shell script lint (shellcheck)
        run: npm run lint:shell

      # Quick fixed-seed parser fuzz smoke; the deep nightly run is fuzz.yml.
      - name: Fuzz smoke (parsers)
        run: npm run fuzz -- --iters=2000 --seed=1

      - name: Build and validate exact extension packages
        run: npm run package

      - name: Build (web app)
        run: npm run build:web

      - name: Build (CLI)
        run: npm run build:cli

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: CLI smoke test (Deno)
        run: |
          echo "deno smoke: save + restore a vault with the bundled CLI" > /tmp/ss-secret.txt
          STEGOSHARD_PASSWORD='Correct-Horse-Battery-Staple-42!' deno run --allow-read --allow-write --allow-env \
            dist-cli/stegoshard.js save /tmp/ss-secret.txt --out /tmp/ss-out
          STEGOSHARD_PASSWORD='Correct-Horse-Battery-Staple-42!' deno run --allow-read --allow-write --allow-env \
            dist-cli/stegoshard.js restore /tmp/ss-out --out /tmp/ss-restored
          diff /tmp/ss-secret.txt /tmp/ss-restored/ss-secret.txt
          echo "Deno round-trip OK"

      - name: Upload validated browser builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-browser-builds
          path: dist-release
          if-no-files-found: error

  browser-e2e:
    name: Browser, accessibility, CSP, and extension smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-browser-builds
          path: dist-release
      - name: Build production web app
        run: npm run build:web
      # For the cli-ui specs: this produces both dist-cli/web-ui (what
      # `stegoshard ui` serves) and web-dist-offline/serve.mjs (the launcher the
      # download ships). Without it those specs have nothing to start, and they
      # fail rather than skip, so this step cannot be dropped unnoticed.
      - name: Build CLI and offline web app
        run: npm run build:cli
      - name: Install pinned browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser E2E suite
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  crypto-scan:
    name: Post-quantum crypto scan (QRAMM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.0'

      - name: Install QRAMM scanners
        run: |
          go install github.com/csnp/cryptoscan/cmd/cryptoscan@v1.3.0
          go install github.com/csnp/qramm-cryptodeps/cmd/cryptodeps@v1.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Source scan. Auto-detects .cryptoscan.yaml (failOn: high + documented false-positive
      # suppressions), so this fails only if a *new* HIGH/CRITICAL algorithm is introduced.
      - name: cryptoscan, gate on new weak/quantum-vulnerable crypto
        run: cryptoscan scan .

      # Cryptographic Bill of Materials, uploaded as a build artifact (not committed,
      # it tracks dependency capabilities and would drift).
      - name: cryptoscan, generate CBOM
        run: cryptoscan scan . --format cbom --output crypto-bom.json

      # Dependency view. Capability-based for npm/pypi (reachability is Go-only), so it
      # over-reports what libraries *can* do (hash-wasm→MD5/SHA-1, cryptography→RSA) vs
      # what StegoShard actually uses (Argon2id, AES-256-GCM). Informational only.
      - name: cryptodeps, dependency report (informational)
        run: cryptodeps analyze . --fail-on none

      - name: Upload CBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crypto-bom
          path: crypto-bom.json

  crypto-compliance:
    name: Primitive compliance (crypto-condor)
    runs-on: ubuntu-latest
    env:
      # TestU01 still uses K&R function definitions, which a C23-default compiler
      # rejects outright. Pinning the dialect keeps the build working regardless of
      # which gcc the runner image ships.
      CFLAGS: '-std=gnu89 -w'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-compliance.lock

      # crypto-condor compiles its internal AES and TestU01 on first use, into a
      # per-user cache directory. Without this the C build is repaid every run.
      - name: Cache crypto-condor build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crypto-condor
          key: crypto-condor-${{ runner.os }}-${{ hashFiles('python/requirements-compliance.lock') }}

      - name: Install build tools for TestU01
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install --require-hashes -r python/requirements-compliance.lock

      # This lockfile is dev-only and never shipped, but it still gets audited.
      # Two separate crypto-condor 2025.9.8 bounds hold cryptography at 43.0.3:
      #   - a direct `cryptography<44`, which alone blocks 44.0.1 (that release
      #     needs only `cffi>=1.12`, so cffi is not the obstacle there);
      #   - `cffi<2`, which additionally blocks 46.0.5 and newer, since those
      #     require `cffi>=2.0.0` on Python 3.9+.
      # Overriding the first alone resolves to cryptography 45.0.7 with cffi
      # untouched and clears exactly one advisory (PYSEC-2026-1284); the other six
      # need 46.0.6 or later and therefore the cffi bump too. Carrying six ignores
      # instead of seven does not justify running the tool that supplies our
      # assurance on dependencies its author has not tested, in an environment
      # whose entire input is published test vectors. crypto-condor itself does run
      # correctly under cryptography 50 (identical CAVP results), so the bounds look
      # conservative rather than load-bearing: revisit when upstream relaxes them.
      # `click` was pinned forward instead, since that one was ours to fix.
      - name: Audit compliance dependencies
        run: >-
          pip-audit -r python/requirements-compliance.lock --require-hashes
          --ignore-vuln PYSEC-2026-35
          --ignore-vuln PYSEC-2026-1284
          --ignore-vuln PYSEC-2026-2141
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf

      # CI=true turns a missing TestU01 into a hard failure instead of a skip, so
      # the randomness group can never quietly stop running.
      - name: Primitive compliance suite
        run: npm run test:compliance -- -q

  conformance:
    name: Python decoder conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-dev.lock

      - name: Install dependencies
        run: npm ci

      - name: Generate fixtures (extension encodes)
        run: npm run fixtures -- python/tests/_fixtures

      - name: Install Python dependencies
        run: pip install --require-hashes -r python/requirements-dev.lock

      - name: Python lint and typecheck
        run: |
          ruff check python
          mypy python/stegoshard

      - name: Audit Python runtime dependencies
        run: pip-audit -r python/requirements.lock --require-hashes

      - name: Generate reproducible Python runtime SBOM
        run: >-
          cyclonedx-py requirements python/requirements.lock
          --output-reproducible
          --output-file python-runtime.cdx.json

      - name: Upload Python runtime SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-runtime-sbom
          path: python-runtime.cdx.json
          if-no-files-found: error

      - name: Conformance test (Python decodes)
        run: pytest python -q
