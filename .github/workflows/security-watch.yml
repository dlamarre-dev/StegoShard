name: Security watch

# The dependency audits in ci.yml run only when something is pushed. Once the
# dependency set is frozen after an audit, nothing gets pushed for weeks at a
# time, and an advisory published against a version we already ship would go
# unnoticed until the next unrelated change. This re-runs the same audits
# against the committed lockfiles every day, with no code change needed.
#
# A failure opens (or comments on) one tracking issue, which starts the fast
# lane in docs/DEPENDENCIES.md.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-watch
  cancel-in-progress: false

jobs:
  audit:
    name: Audit committed lockfiles
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm

      # Install scripts are not needed to audit, so they do not get to run.
      - name: Install dependencies
        id: npm-install
        run: npm ci --ignore-scripts

      # Every audit below runs even when an earlier one failed. The first
      # scheduled run failed on an npm advisory and stopped there, so a Python
      # advisory published the evening before went unreported until a PR's CI
      # tripped over it. One red step must not hide another.

      # Same gate as ci.yml, including the reviewed exceptions in scripts/audit.ts.
      - name: Audit JavaScript dependencies
        if: ${{ !cancelled() && steps.npm-install.outcome == 'success' }}
        run: npm run audit

      # Every installed tarball must carry a valid registry signature: catches a
      # lockfile entry that no longer matches what the registry published.
      - name: Verify registry signatures
        if: ${{ !cancelled() && steps.npm-install.outcome == 'success' }}
        run: npm audit signatures

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: setup-python
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-dev.lock

      - name: Install pip-audit
        id: pip-install
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' }}
        run: pip install --require-hashes -r python/requirements-dev.lock

      # requirements-compliance.lock is left to ci.yml: it carries reviewed
      # ignores that belong in one place only, and it is a dev-only environment
      # fed nothing but published test vectors.
      - name: Audit Python dependencies
        if: ${{ !cancelled() && steps.pip-install.outcome == 'success' }}
        run: |
          status=0
          for lock in requirements requirements-dev requirements-erasure requirements-steganalysis; do
            echo "::group::python/$lock.lock"
            pip-audit -r "python/$lock.lock" --require-hashes || status=1
            echo "::endgroup::"
          done
          exit "$status"

  report:
    name: Open tracking issue
    needs: audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Security watch: dependency audit failing'
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          body="The scheduled dependency audit failed: $RUN_URL

          Triage within 24 hours per docs/DEPENDENCIES.md (fast lane)."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "$body"
          fi
