[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["python/tests/_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["python/tests/_fixtures"]

[tool.pytest.ini_options]
testpaths = ["python"]
