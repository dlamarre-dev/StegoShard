<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="6Ds3RKHLz46hfpQwb__ZTQ0Tuk_0d2ZMGwfy6S0WJ9s" />
    <title>StegoShard — encrypt files into resilient images</title>
    <meta
      name="description"
      content="Encrypt a file into robust, error-corrected images you can store on disk or print. Open source, offline, nothing leaves your device."
    />
    <link rel="icon" href="./icons/icon.svg" />
    <link rel="stylesheet" href="../ui/ui.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="brand">
        <img class="logo" src="./icons/icon.svg" alt="" />
        <div class="brand-name">StegoShard</div>
      </div>
      <div class="appbar-actions">
        <button id="workflows-btn" class="btn-ghost" data-i18n="btnWorkflows" hidden></button>
        <select id="lang-select" class="lang-select" aria-label="Language"></select>
      </div>
    </header>

    <main class="app">
      <section class="card banner">
        <p class="banner-lead" data-i18n="popupTagline"></p>
        <p class="lead" data-i18n="webIntro"></p>
      </section>

      <!-- Launch chooser: pick a workflow. -->
      <section id="chooser" class="card banner" hidden>
        <h2 data-i18n="chooserTitle"></h2>
        <p class="lead" data-i18n="chooserBody"></p>
        <div class="chooser-grid">
          <button id="choose-guided" class="chooser-card" type="button">
            <span class="chooser-card-title" data-i18n="workflowGuided"></span>
            <span class="chooser-card-desc muted" data-i18n="workflowGuidedDesc"></span>
            <span
              id="rec-guided"
              class="pill pill-ok"
              data-i18n="workflowRecommended"
              hidden
            ></span>
          </button>
          <button id="choose-expert" class="chooser-card" type="button">
            <span class="chooser-card-title" data-i18n="workflowExpert"></span>
            <span class="chooser-card-desc muted" data-i18n="workflowExpertDesc"></span>
            <span
              id="rec-expert"
              class="pill pill-ok"
              data-i18n="workflowRecommended"
              hidden
            ></span>
          </button>
        </div>
      </section>

      <!-- Guided workflow mounts here. -->
      <div id="wizard-root" hidden></div>

      <div id="expert-view" class="grid" hidden>
        <section class="card">
          <div class="card-head"><h2 data-i18n="saveHeading"></h2></div>

          <div id="file-drop" class="dropzone" tabindex="0" role="button">
            <svg
              class="dz-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 16V4M7 9l5-5 5 5" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <span class="dz-prompt">
              <span class="dz-title" data-i18n="dropTitle"></span><br />
              <span class="muted" data-i18n="dropPrompt"></span>
            </span>
            <span id="dz-file" class="dz-file"></span>
            <input id="save-file" type="file" />
          </div>
          <p id="size-line" class="muted estimate-line">
            <span data-i18n="labelFileSize"></span> <span id="save-size" class="badge">—</span>
          </p>

          <input
            id="save-pw"
            type="password"
            autocomplete="new-password"
            data-i18n-placeholder="labelPassword"
          />

          <div class="advanced-static">
            <label class="muted" data-i18n="destHeading"></label>
            <fieldset class="segmented">
              <legend class="sr-only" data-i18n="destHeading"></legend>
              <div class="seg-item">
                <label>
                  <input type="radio" name="dest" value="disk" checked />
                  <svg
                    class="seg-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <rect x="3" y="3" width="14" height="14" rx="2" />
                    <path d="M7 21h12a2 2 0 0 0 2-2V7" />
                    <path d="m3 13 3.5-3.5 3 3" />
                  </svg>
                  <span class="seg-label" data-i18n="destDisk"></span>
                </label>
                <span class="seg-hint" role="tooltip" data-i18n="destDiskDesc"></span>
              </div>
              <div class="seg-item">
                <label>
                  <input type="radio" name="dest" value="paper" />
                  <svg
                    class="seg-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M7 9V3h10v6" />
                    <path
                      d="M7 19H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
                    />
                    <rect x="7" y="15" width="10" height="6" rx="1" />
                  </svg>
                  <span class="seg-label" data-i18n="destPaper"></span>
                </label>
                <span class="seg-hint" role="tooltip" data-i18n="destPaperDesc"></span>
              </div>
              <div class="seg-item">
                <label>
                  <input type="radio" name="dest" value="binary" />
                  <svg
                    class="seg-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z" />
                    <path d="M14 3v5h5" />
                  </svg>
                  <span class="seg-label" data-i18n="destBinary"></span>
                </label>
                <span class="seg-hint" role="tooltip" data-i18n="destBinaryDesc"></span>
              </div>
              <div class="seg-item">
                <label>
                  <input type="radio" name="dest" value="sqlite" />
                  <svg
                    class="seg-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <ellipse cx="12" cy="6" rx="8" ry="3" />
                    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6" />
                    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" />
                  </svg>
                  <span class="seg-label" data-i18n="destSqlite"></span>
                  <span class="mode-badge mode-badge--deniable" data-i18n="badgeDeniable"></span>
                </label>
                <span class="seg-hint" role="tooltip" data-i18n="destSqliteDesc"></span>
              </div>
              <div class="seg-item">
                <label>
                  <input type="radio" name="dest" value="gallery" />
                  <svg
                    class="seg-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <circle cx="8.5" cy="9.5" r="1.5" />
                    <path d="m4 18 5-5 4 4 3-3 4 4" />
                  </svg>
                  <span class="seg-label" data-i18n="destGallery"></span>
                  <span class="mode-badge mode-badge--deniable" data-i18n="badgeDeniable"></span>
                </label>
                <span class="seg-hint" role="tooltip" data-i18n="destGalleryDesc"></span>
              </div>
            </fieldset>
            <p id="estimate-line" class="muted estimate-line">
              <span data-i18n="estimateFiles"></span> <span id="estimate" class="badge">—</span>
            </p>
            <p id="no-format" class="status error" hidden></p>

            <div id="codec-fields">
              <label class="muted" data-i18n="codecHeading"></label>
              <fieldset class="segmented">
                <legend class="sr-only" data-i18n="codecHeading"></legend>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="codec" value="color" checked />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="3" width="18" height="18" rx="2" />
                      <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
                    </svg>
                    <span class="seg-label" data-i18n="codecColor"></span>
                    <span class="seg-note" id="codec-count-color"></span>
                  </label>
                  <span class="seg-hint" role="tooltip" data-i18n="codecColorDesc"></span>
                </div>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="codec" value="qr" />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="3" width="7" height="7" rx="1" />
                      <rect x="14" y="3" width="7" height="7" rx="1" />
                      <rect x="3" y="14" width="7" height="7" rx="1" />
                      <path d="M14 14h3v3h-3z" />
                      <path d="M19 19h2v2h-2z" />
                    </svg>
                    <span class="seg-label" data-i18n="codecQr"></span>
                    <span class="seg-note" id="codec-count-qr"></span>
                  </label>
                  <span class="seg-hint" role="tooltip" data-i18n="codecQrDesc"></span>
                </div>
              </fieldset>
              <details class="why">
                <summary data-i18n="whyLabel"></summary>
                <p data-i18n="codecHelp"></p>
              </details>
            </div>

            <div id="keymode-fields">
              <label class="muted" data-i18n="keyModeHeading"></label>
              <fieldset class="segmented">
                <legend class="sr-only" data-i18n="keyModeHeading"></legend>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="keymode" value="embedded" checked />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="2" />
                      <circle cx="9.5" cy="14.5" r="2.5" />
                      <path d="m11.3 12.7 4.2-4.2M14 10l1.8 1.8" />
                    </svg>
                    <span class="seg-label" data-i18n="keyModeEmbedded"></span>
                  </label>
                  <span
                    class="seg-hint"
                    role="tooltip"
                    data-i18n="keyModeEmbeddedDesc"
                    data-i18n-file="keyModeEmbeddedDescFile"
                  ></span>
                </div>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="keymode" value="keyfile" />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <circle cx="7.5" cy="15.5" r="3.5" />
                      <path d="M10.2 12.8 20 3M15 8l3 3" />
                    </svg>
                    <span class="seg-label" data-i18n="keyModeKeyfile"></span>
                  </label>
                  <span
                    class="seg-hint"
                    role="tooltip"
                    data-i18n="keyModeKeyfileDesc"
                    data-i18n-file="keyModeKeyfileDescFile"
                  ></span>
                </div>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="keymode" value="stego" />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="2" />
                      <path d="m4 18 5-5 3 3" />
                      <circle cx="15.5" cy="13" r="2.5" />
                      <path d="m17.3 11.2 3.2-3.2M19 9.5l1.5 1.5" />
                    </svg>
                    <span class="seg-label" data-i18n="keyModeStego"></span>
                  </label>
                  <span class="seg-hint" role="tooltip" data-i18n="keyModeStegoDesc"></span>
                </div>
              </fieldset>
              <details class="why">
                <summary data-i18n="whyLabel"></summary>
                <p data-i18n="keyModeHelp" data-i18n-file="keyModeHelpFile"></p>
              </details>
            </div>

            <div id="gallery-fields" hidden>
              <p class="muted" data-i18n="galleryIntro"></p>
              <div id="gallery-covers-drop" class="dropzone dropzone-sm" tabindex="0" role="button">
                <span class="dz-prompt">
                  <span class="dz-title" data-i18n="galleryCoversTitle"></span><br />
                  <span class="muted" data-i18n="dropPrompt"></span>
                </span>
                <span id="gallery-covers-name" class="dz-file"></span>
                <input id="gallery-covers" type="file" accept="image/png,image/jpeg" multiple />
              </div>
              <p class="muted" data-i18n="galleryPasswordHint"></p>

              <label class="muted" data-i18n="keyModeHeading"></label>
              <fieldset class="segmented">
                <legend class="sr-only" data-i18n="keyModeHeading"></legend>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="gallery-keymode" value="embedded" checked />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="2" />
                      <circle cx="9.5" cy="14.5" r="2.5" />
                      <path d="m11.3 12.7 4.2-4.2M14 10l1.8 1.8" />
                    </svg>
                    <span class="seg-label" data-i18n="keyModeEmbedded"></span>
                  </label>
                  <span class="seg-hint" role="tooltip" data-i18n="keyModeEmbeddedDesc"></span>
                </div>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="gallery-keymode" value="keyfile" />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <circle cx="7.5" cy="15.5" r="3.5" />
                      <path d="M10.2 12.8 20 3M15 8l3 3" />
                    </svg>
                    <span class="seg-label" data-i18n="keyModeKeyfile"></span>
                  </label>
                  <span class="seg-hint" role="tooltip" data-i18n="keyModeKeyfileDesc"></span>
                </div>
                <div class="seg-item">
                  <label>
                    <input type="radio" name="gallery-keymode" value="stego" />
                    <svg
                      class="seg-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="2" />
                      <path d="m4 18 5-5 3 3" />
                      <circle cx="15.5" cy="13" r="2.5" />
                      <path d="m17.3 11.2 3.2-3.2M19 9.5l1.5 1.5" />
                    </svg>
                    <span class="seg-label" data-i18n="keyModeStego"></span>
                  </label>
                  <span class="seg-hint" role="tooltip" data-i18n="keyModeStegoDesc"></span>
                </div>
              </fieldset>
              <div id="gallery-stego-fields" hidden>
                <div
                  id="gallery-cover-drop"
                  class="dropzone dropzone-sm"
                  tabindex="0"
                  role="button"
                >
                  <span class="dz-prompt">
                    <span class="dz-title" data-i18n="coverTitle"></span><br />
                    <span class="muted" data-i18n="dropPrompt"></span>
                  </span>
                  <span id="gallery-cover-name" class="dz-file"></span>
                  <input id="gallery-cover" type="file" accept="image/png,image/jpeg" />
                </div>
                <p class="muted warn" data-i18n="stegoWarning"></p>
              </div>
            </div>

            <div id="mode-fields" hidden>
              <label class="muted" data-i18n="accessModeHeading"></label>
              <fieldset class="segmented">
                <legend class="sr-only" data-i18n="accessModeHeading"></legend>
                <label
                  ><input type="radio" name="accessmode" value="plain" checked /><span
                    data-i18n="accessModePlain"
                  ></span
                ></label>
                <label id="mode-duress-label"
                  ><input type="radio" name="accessmode" value="duress" /><span
                    data-i18n="accessModeDuress"
                  ></span
                ></label>
                <label
                  ><input type="radio" name="accessmode" value="nonpossession" /><span
                    data-i18n="accessModeNonpossession"
                  ></span
                ></label>
              </fieldset>
              <div id="duress-fields" hidden>
                <label class="stack-gap" data-i18n="labelDuressPassword" for="duress-pw"></label>
                <input id="duress-pw" type="password" autocomplete="new-password" />
                <div id="decoy-drop" class="dropzone dropzone-sm" tabindex="0" role="button">
                  <span class="dz-prompt">
                    <span class="dz-title" data-i18n="decoyTitle"></span><br />
                    <span class="muted" data-i18n="dropPrompt"></span>
                  </span>
                  <span id="decoy-name" class="dz-file"></span>
                  <input id="decoy-file" type="file" />
                </div>
                <p class="muted warn" data-i18n="duressWarning"></p>
                <a
                  class="warn-link"
                  href="https://github.com/dlamarre-dev/StegoShard/blob/main/docs/THREAT-MODEL.md#duress-and-key-disclosure-law"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="duressLegalLink"
                ></a>
                <p id="factor-duress-hint" class="muted" data-i18n="factorDuressHint" hidden></p>
              </div>
              <div id="threshold-fields" hidden>
                <label class="stack-gap" data-i18n="labelThreshold"></label>
                <div class="field-row">
                  <input id="threshold-k" type="number" min="1" max="255" value="2" />
                  <span aria-hidden="true">/</span>
                  <input id="threshold-n" type="number" min="1" max="255" value="3" />
                </div>
                <p class="muted" data-i18n="thresholdHint"></p>
              </div>
            </div>

            <div id="stego-fields" hidden>
              <div id="cover-drop" class="dropzone dropzone-sm" tabindex="0" role="button">
                <svg
                  class="dz-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="3" y="4" width="18" height="16" rx="2" />
                  <circle cx="8.5" cy="9.5" r="1.5" />
                  <path d="m4 18 5-5 4 4 3-3 4 4" />
                </svg>
                <span class="dz-prompt">
                  <span class="dz-title" data-i18n="coverTitle"></span><br />
                  <span class="muted" data-i18n="dropPrompt"></span>
                </span>
                <span id="cover-dz-file" class="dz-file"></span>
                <input id="cover-file" type="file" accept="image/png,image/jpeg" />
              </div>
              <p class="muted warn" data-i18n="stegoWarning"></p>
            </div>

            <label id="add-band-label" class="checkbox"
              ><input id="add-band" type="checkbox" /> <span data-i18n="labelAddBand"></span
            ></label>
            <div id="band-fields" hidden>
              <input id="band-title" type="text" data-i18n-placeholder="titlePlaceholder" />
              <p class="muted warn" data-i18n="bandWarning"></p>
            </div>

            <label id="zip-field" class="checkbox"
              ><input id="as-zip" type="checkbox" checked /> <span data-i18n="labelAsZip"></span
            ></label>

            <div id="paper-fields" hidden>
              <label class="checkbox"
                ><input id="add-instructions" type="checkbox" />
                <span data-i18n="labelInstructions"></span
              ></label>
              <label data-i18n="labelPasswordHint" for="pw-hint"></label>
              <input id="pw-hint" type="text" />
              <label data-i18n="labelKeyLocation" for="key-location"></label>
              <input id="key-location" type="text" />
              <p class="muted warn" data-i18n="paperCleartextWarn"></p>
            </div>

            <div id="entropy-fields">
              <label class="muted" data-i18n="extraEntropyHeading" for="extra-entropy"></label>
              <textarea
                id="extra-entropy"
                rows="2"
                autocomplete="off"
                spellcheck="false"
                data-i18n-placeholder="extraEntropyPlaceholder"
              ></textarea>
              <p class="muted">
                <span data-i18n="extraEntropyAlwaysCsprng"></span>
                <span id="extra-entropy-bits" class="badge" hidden></span>
              </p>
              <details class="why">
                <summary data-i18n="whyLabel"></summary>
                <p data-i18n="extraEntropyHelp"></p>
              </details>
            </div>
          </div>

          <button
            id="save-btn"
            class="btn-primary btn-lg"
            data-i18n="btnSave"
            data-i18n-file="btnSaveFile"
          ></button>
          <p id="save-status" class="status" role="status"></p>
          <div
            id="save-progress"
            class="progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            hidden
          >
            <div id="save-progress-bar" class="progress-bar"></div>
          </div>
          <div id="save-result" class="result" hidden>
            <p class="result-title" data-i18n="savedTitle"></p>
            <p id="save-result-note" class="result-note"></p>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2 data-i18n="restoreHeading"></h2></div>

          <fieldset class="segmented">
            <legend class="sr-only" data-i18n="restoreModeHeading"></legend>
            <label
              ><input type="radio" name="restore-mode" value="standard" checked /><span
                data-i18n="restoreModeStandard"
              ></span
            ></label>
            <label
              ><input type="radio" name="restore-mode" value="gallery" /><span
                data-i18n="restoreModeGallery"
              ></span
            ></label>
          </fieldset>
          <p id="restore-gallery-hint" class="muted" data-i18n="galleryIntro" hidden></p>

          <div id="restore-drop" class="dropzone" tabindex="0" role="button">
            <svg
              class="dz-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 4v12M7 11l5 5 5-5" />
              <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
            <span class="dz-prompt">
              <span class="dz-title" data-i18n="labelImagesOrZip"></span><br />
              <span class="muted" data-i18n="dropPrompt"></span>
            </span>
            <span id="restore-dz-file" class="dz-file"></span>
            <input
              id="restore-files"
              type="file"
              accept="image/*,.zip,.pdf,application/pdf"
              multiple
            />
          </div>

          <button id="camera-btn" class="btn-ghost camera-btn" hidden>
            <svg
              class="camera-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"
              />
              <circle cx="12" cy="13.5" r="3.5" />
            </svg>
            <span data-i18n="btnScanCamera"></span>
          </button>
          <p id="camera-captured" class="muted camera-captured" hidden></p>

          <input
            id="restore-pw"
            class="stack-gap"
            type="password"
            autocomplete="current-password"
            data-i18n-placeholder="labelPassword"
          />

          <div id="restore-advanced" class="advanced-static">
            <div id="key-drop" class="dropzone dropzone-sm" tabindex="0" role="button">
              <svg
                class="dz-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="7.5" cy="15.5" r="3.5" />
                <path d="M10.2 12.8 20 3M15 8l3 3" />
              </svg>
              <span class="dz-prompt">
                <span class="dz-title" data-i18n="labelKeyFileOrImage"></span><br />
                <span class="muted" data-i18n="dropPrompt"></span>
              </span>
              <span id="key-dz-file" class="dz-file"></span>
              <input id="restore-key" type="file" accept=".key,image/png,image/jpeg" />
            </div>
            <p class="muted" data-i18n="keyFileHint"></p>
            <div id="shares-drop" class="dropzone dropzone-sm" tabindex="0" role="button">
              <span class="dz-prompt">
                <span class="dz-title" data-i18n="labelShareFiles"></span><br />
                <span class="muted" data-i18n="dropPrompt"></span>
              </span>
              <span id="shares-dz-file" class="dz-file"></span>
              <input id="restore-shares" type="file" accept=".txt,text/plain" multiple />
            </div>
            <p class="muted" data-i18n="shareFilesHint"></p>
          </div>

          <button id="restore-btn" class="btn-primary btn-lg" data-i18n="btnRestore"></button>
          <p id="restore-status" class="status" role="status"></p>
          <div
            id="restore-progress"
            class="progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            hidden
          >
            <div id="restore-progress-bar" class="progress-bar"></div>
          </div>
          <div id="restore-result" class="result" hidden>
            <p class="result-title" data-i18n="restoredTitle"></p>
            <p id="restore-result-note" class="result-note"></p>
          </div>
        </section>
      </div>

      <footer class="app-footer muted">
        <a href="./privacy.html" data-i18n="footerPrivacy">Privacy</a> ·
        <a href="./terms.html" data-i18n="footerTerms">Terms</a> ·
        <a href="https://github.com/dlamarre-dev/StegoShard" data-i18n="footerSource"
          >Source (MIT)</a
        >
      </footer>
    </main>

    <dialog id="camera-modal" class="modal camera-modal">
      <div class="modal-head">
        <h2 data-i18n="cameraTitle"></h2>
        <button id="camera-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body camera-body">
        <div class="camera-frame">
          <video id="camera-video" autoplay playsinline muted></video>
        </div>
        <p class="muted" data-i18n="cameraHint"></p>
        <p id="camera-count" class="status" role="status"></p>
        <button id="camera-done" class="btn-primary" data-i18n="cameraDone"></button>
      </div>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
