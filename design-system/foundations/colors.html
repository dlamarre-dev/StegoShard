<!-- @dsCard group="Foundations" name="Colors" subtitle="Semantic tokens — light & dark" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StegoShard — Colors</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f9;--surface:#fff;--surface-2:#f0f2f5;--text:#1a1d21;--muted:#626c78;--border:#e3e7ec;--accent:#3b5bdb;--accent-hover:#2f49b8;--accent-contrast:#fff;--ok:#2b8a3e;--danger:#c0392b;--warn:#b9770e;--radius:14px;--radius-sm:9px;--shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.05);--font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--surface:#171b22;--surface-2:#1f2530;--text:#e6eaef;--muted:#98a2b0;--border:#2a313c;--accent:#5c7cfa;--accent-hover:#748ffc;--accent-contrast:#0e1116;--ok:#51cf66;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;padding:24px}
h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.chip{height:56px}
.meta{padding:8px 10px}
.name{font-weight:600;font-size:.85rem}
.val{font-size:.78rem;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<h3>Palette</h3>
<div class="swatches">
  <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="meta"><div class="name">--bg</div><div class="val">page</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="name">--surface</div><div class="val">cards</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><div class="name">--surface-2</div><div class="val">inputs / fills</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--border)"></div><div class="meta"><div class="name">--border</div><div class="val">hairlines</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--text)"></div><div class="meta"><div class="name">--text</div><div class="val">body</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="meta"><div class="name">--muted</div><div class="val">secondary</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="name">--accent</div><div class="val">brand / primary</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--accent-hover)"></div><div class="meta"><div class="name">--accent-hover</div><div class="val">primary hover</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--ok)"></div><div class="meta"><div class="name">--ok</div><div class="val">success</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="meta"><div class="name">--danger</div><div class="val">error</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--warn)"></div><div class="meta"><div class="name">--warn</div><div class="val">warning</div></div></div>
</div>
</body>
</html>
