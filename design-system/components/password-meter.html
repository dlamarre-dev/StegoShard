<!-- @dsCard group="Components" name="Password strength meter" subtitle="5-step score scale" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StegoShard — Password meter</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f9;--surface:#fff;--surface-2:#f0f2f5;--text:#1a1d21;--muted:#626c78;--border:#e3e7ec;--accent:#3b5bdb;--font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--surface:#171b22;--surface-2:#1f2530;--text:#e6eaef;--muted:#98a2b0;--border:#2a313c;--accent:#5c7cfa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;padding:24px;max-width:360px}
.pw-field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.pw-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pw-meter{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.pw-meter-bar{height:100%;background:#c0392b}
.pw-score-1{background:#e07b39}.pw-score-2{background:#d6a012}.pw-score-3{background:var(--accent)}.pw-score-4{background:#1e8449}
.pw-meter-label{margin:0;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div class="pw-field"><div class="pw-meter"><div class="pw-meter-bar" style="width:20%"></div></div><p class="pw-meter-label">Very weak</p></div>
<div class="pw-field"><div class="pw-meter"><div class="pw-meter-bar pw-score-1" style="width:40%"></div></div><p class="pw-meter-label">Weak</p></div>
<div class="pw-field"><div class="pw-meter"><div class="pw-meter-bar pw-score-2" style="width:60%"></div></div><p class="pw-meter-label">Fair</p></div>
<div class="pw-field"><div class="pw-meter"><div class="pw-meter-bar pw-score-3" style="width:80%"></div></div><p class="pw-meter-label">Good</p></div>
<div class="pw-field"><div class="pw-meter"><div class="pw-meter-bar pw-score-4" style="width:100%"></div></div><p class="pw-meter-label">Strong</p></div>
</body>
</html>
