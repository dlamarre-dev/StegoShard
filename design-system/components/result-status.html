<!-- @dsCard group="Components" name="Result & status" subtitle="Success panel, status text, error state" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StegoShard: Result & status</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f9;
        --surface: #fff;
        --surface-2: #f0f2f5;
        --text: #1a1d21;
        --muted: #626c78;
        --border: #e3e7ec;
        --accent: #3b5bdb;
        --ok: #2b8a3e;
        --danger: #c0392b;
        --radius-sm: 9px;
        --font:
          system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans',
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1116;
          --surface: #171b22;
          --surface-2: #1f2530;
          --text: #e6eaef;
          --muted: #98a2b0;
          --border: #2a313c;
          --accent: #5c7cfa;
          --ok: #51cf66;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
        padding: 24px;
        max-width: 420px;
      }
      .result {
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--border));
        background: color-mix(in srgb, var(--ok) 10%, transparent);
        margin-bottom: 18px;
      }
      .result-title {
        font-weight: 600;
        color: var(--ok);
        margin: 0 0 2px;
      }
      .result-note {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0;
      }
      .status {
        min-height: 1.3em;
        font-size: 0.88rem;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .status.error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="result">
      <p class="result-title">Saved as photo-4821.png</p>
      <p class="result-note">Keep this image and your passphrase to restore the file later.</p>
    </div>
    <p class="status">Encrypting… 62%</p>
    <p class="status error">That image doesn’t contain StegoShard data.</p>
  </body>
</html>
