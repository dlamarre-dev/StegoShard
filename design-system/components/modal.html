<!-- @dsCard group="Components" name="Modal" subtitle="Settings dialog — head, body, icon button" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StegoShard — Modal</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f9;
        --surface: #fff;
        --surface-2: #f0f2f5;
        --text: #1a1d21;
        --muted: #626c78;
        --border: #e3e7ec;
        --accent: #3b5bdb;
        --radius-sm: 9px;
        --font:
          system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans',
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1116;
          --surface: #171b22;
          --surface-2: #1f2530;
          --text: #e6eaef;
          --muted: #98a2b0;
          --border: #2a313c;
          --accent: #5c7cfa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 280px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.5;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .modal {
        border-radius: 16px;
        width: min(480px, 100%);
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h2 {
        font-size: 1.1rem;
        margin: 0;
      }
      .modal-body {
        padding: 16px 20px 22px;
      }
      .icon-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1;
        cursor: pointer;
        padding: 6px 9px;
        border-radius: 8px;
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.9rem;
        margin: 0 0 5px;
      }
      input {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="modal">
      <div class="modal-head">
        <h2>Settings</h2>
        <button class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label for="k">Default key label</label>
        <input id="k" type="text" value="Personal" />
      </div>
    </div>
  </body>
</html>
